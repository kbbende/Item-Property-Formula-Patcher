name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore ItemPropertyFormulaPatcher.sln --locked-mode
      - run: dotnet build ItemPropertyFormulaPatcher.sln --no-restore --configuration Release
      - run: dotnet test ItemPropertyFormulaPatcher.sln --no-build --configuration Release --logger trx
